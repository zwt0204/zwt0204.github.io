<svg xmlns="http://www.w3.org/2000/svg" width="1078" height="330" viewBox="0 0 1078 330" role="img" aria-labelledby="title desc">
<title id="title">UniDrive: A Unified Vision-Language and Grounding Framework for Interpretable Risk Understanding in Autonomous Driving 方法架构</title>
<desc id="desc">自动驾驶风险理解方法链路：从视觉证据到 grounded explanation，再到可验证的风险输出。</desc>
<defs>
