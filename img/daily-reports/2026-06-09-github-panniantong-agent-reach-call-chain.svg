<svg xmlns="http://www.w3.org/2000/svg" width="1078" height="330" viewBox="0 0 1078 330" role="img" aria-labelledby="title desc">
<title id="title">Panniantong/Agent-Reach 代码调用链</title>
<desc id="desc">Agent 项目的代码调用链：用户请求被编排成工具调用，再用 observation 更新状态。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff7ed"/><stop offset="100%" stop-color="#eff6ff"/></linearGradient>
<filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.15"/></filter>
</defs>
<rect width="1078" height="330" rx="18" fill="url(#bg)"/>
<text x="34" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">代码调用链阅读图</text>
<text x="34" y="70" font-family="Arial, sans-serif" font-size="14" fill="#475569">Agent 项目的代码调用链：用户请求被编排成工具调用，再用 observation 更新状态。</text>
