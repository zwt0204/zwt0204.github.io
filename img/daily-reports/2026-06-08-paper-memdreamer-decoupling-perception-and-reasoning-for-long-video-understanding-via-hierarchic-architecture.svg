<svg xmlns="http://www.w3.org/2000/svg" width="1078" height="330" viewBox="0 0 1078 330" role="img" aria-labelledby="title desc">
<title id="title">MemDreamer: Decoupling Perception and Reasoning for Long Video Understanding via Hierarchical Graph Memory and Agentic Retrieval Mechanism 方法架构</title>
