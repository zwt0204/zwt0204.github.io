<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="google-site-verification" content="xBT4GhYoi5qRD5tr338pgPM5OWHHIDR6mNg1a3euekI" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="{{ site.description }}">
    <meta name="keywords"  content="{{ site.keyword }}">
    <meta name="theme-color" content="{{ site.chrome-tab-theme-color }}">
    
    <!-- Open Graph -->
    <meta property="og:title" content="{% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{ site.SEOTitle }}{% endif %}">
    {% case page.layout %}
    {% when 'post' %}
    <meta property="og:type" content="article">
    <meta property="og:description" content="{{ page.excerpt | strip_html | truncate:200 }}">
    {% if page.date %}
    <meta property="article:published_time" content="{{ page.date | date: "%Y-%m-%dT%H:%M:%SZ" }}">
    {% endif %}
    {% if page.author %}
    <meta property="article:author" content="{{ page.author }}">
    {% endif %}
    {% for tag in page.tags %}
    <meta property="article:tag" content="{{ tag }}">
    {% endfor %}
    {% else %}
    <meta property="og:type" content="website">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    {% endcase %}
    <meta property="og:image" content="{{ site.url }}{{ site.sidebar-avatar }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:site_name" content="{{ site.SEOTitle }}">
    
    <title>{% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{ site.SEOTitle }}{% endif %}</title>

    <!-- Web App Manifest -->
    <link rel="manifest" href="{{ site.baseurl }}/pwa/manifest.json">

    <!-- Favicon -->
    <link rel="shortcut icon" href="{{ site.baseurl }}/img/favicon.ico">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- Bootstrap Core CSS -->
    <link rel="stylesheet" href="{{ "/css/bootstrap.min.css" | prepend: site.baseurl }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ "/css/hux-blog.min.css" | prepend: site.baseurl }}">

    <!-- Custom Fonts -->
    <!-- <link href="http://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet" type="text/css"> -->
    <!-- Hux change font-awesome CDN to qiniu -->
    <link href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css" rel="stylesheet" type="text/css">


    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

    <style>
        body {
            background:
                radial-gradient(circle at top, rgba(56, 189, 248, 0.08) 0%, transparent 18%),
                radial-gradient(circle at 85% 10%, rgba(99, 102, 241, 0.08) 0%, transparent 20%),
                linear-gradient(180deg, #dbeafe 0%, #eff6ff 18%, #f8fbff 52%, #f8fafc 100%);
        }

        body:before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(56, 189, 248, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.08));
            opacity: 0.6;
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        .navbar-custom {
            background: rgba(255, 255, 255, 0.72);
            border-bottom: 1px solid rgba(148, 163, 184, 0.14);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 28px rgba(37, 99, 235, 0.08);
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .nav li a {
            color: rgba(15, 23, 42, 0.92);
        }

        .navbar-custom .navbar-brand:hover,
        .navbar-custom .nav li a:hover,
        .navbar-custom .nav li a:focus {
            color: #2563eb;
        }

        header.intro-header.page-header {
            overflow: hidden;
            border-bottom: 1px solid rgba(125, 211, 252, 0.16);
            box-shadow: inset 0 -80px 120px rgba(2, 6, 23, 0.34), 0 20px 50px rgba(2, 6, 23, 0.18);
        }

        header.intro-header.page-header:before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(56, 189, 248, 0.08) 0%, transparent 22%, transparent 78%, rgba(99, 102, 241, 0.10) 100%),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 6px);
            mix-blend-mode: screen;
            opacity: 0.8;
        }

        header.intro-header.page-header:after {
            content: "";
            position: absolute;
            left: 50%;
            top: 18%;
            transform: translateX(-50%);
            width: min(920px, 88vw);
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.85), transparent);
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.45);
            pointer-events: none;
            opacity: 0.9;
        }

        header.intro-header.page-header .header-mask {
            background:
                radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.24), transparent 30%),
                radial-gradient(circle at 80% 25%, rgba(59, 130, 246, 0.26), transparent 28%),
                radial-gradient(circle at 50% 0%, rgba(34, 211, 238, 0.10), transparent 26%),
                linear-gradient(180deg, rgba(2, 6, 23, 0.55), rgba(2, 6, 23, 0.78));
        }

        header.intro-header.page-header .site-heading h1 {
            color: #f8fafc;
            letter-spacing: 0.01em;
            text-shadow: 0 0 28px rgba(56, 189, 248, 0.24), 0 0 56px rgba(99, 102, 241, 0.14), 0 2px 14px rgba(2, 6, 23, 0.45);
        }

        header.intro-header.page-header .site-heading .subheading {
            color: rgba(226, 232, 240, 0.90);
            text-shadow: 0 2px 14px rgba(2, 6, 23, 0.42);
        }

        .home-hero-card {
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 20px 44px rgba(37, 99, 235, 0.10), 0 0 0 1px rgba(255, 255, 255, 0.18) inset;
        }

        .home-hero-card:before {
            background: radial-gradient(circle, rgba(56, 189, 248, 0.18), rgba(56, 189, 248, 0));
        }

        .home-hero-card:after {
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12), rgba(99, 102, 241, 0));
        }

        .home-hero-grid {
            opacity: 0.9;
        }

        .hero-core-card,
        .home-hero-stat,
        .post-preview-card,
        .sidebar-container .short-about,
        .sidebar-container .featured-tags {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .hero-core-card {
            border: 1px solid rgba(255, 255, 255, 0.52);
            box-shadow: 0 18px 36px rgba(37, 99, 235, 0.08), 0 0 20px rgba(56, 189, 248, 0.06);
        }

        .hero-core-card:before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 16px;
            pointer-events: none;
        }

        .home-hero-card-tech .hero-orbit,
        .home-hero-card-tech .hero-core-card,
        .home-hero-card-tech .hero-core-status-dot,
        .home-hero-card-tech .hero-signal {
            animation: heroPulse 6.8s ease-in-out infinite;
        }

        .home-hero-card-tech .hero-orbit-md {
            animation-duration: 7.8s;
        }

        .home-hero-card-tech .hero-orbit-sm,
        .home-hero-card-tech .hero-core-status-dot {
            animation-duration: 5.8s;
        }

        .home-hero-card-tech .home-hero-scanline {
            animation: heroSweep 9s ease-in-out infinite;
        }

        .home-hero-btn-primary {
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.32), 0 0 24px rgba(56, 189, 248, 0.16);
        }

        .post-preview-card {
            border: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
        }

        .post-preview-card:hover {
            border-color: rgba(56, 189, 248, 0.36);
            box-shadow: 0 20px 44px rgba(37, 99, 235, 0.12), 0 0 22px rgba(56, 189, 248, 0.10);
        }

        .sidebar-container .short-about,
        .sidebar-container .featured-tags,
        .sidebar-container .friends {
            padding: 16px 18px;
            margin-bottom: 18px;
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
        }

        @keyframes heroPulse {
            0%, 100% {
                transform: translate3d(0, 0, 0) scale(1);
                opacity: 0.92;
            }
            50% {
                transform: translate3d(0, -4px, 0) scale(1.015);
                opacity: 1;
            }
        }

        @keyframes heroSweep {
            0%, 100% {
                transform: rotate(16deg) translate3d(0, 0, 0);
                opacity: 0.48;
            }
            50% {
                transform: rotate(16deg) translate3d(18px, -8px, 0);
                opacity: 0.88;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .home-hero-card-tech .hero-orbit,
            .home-hero-card-tech .hero-core-card,
            .home-hero-card-tech .hero-core-status-dot,
            .home-hero-card-tech .hero-signal,
            .home-hero-card-tech .home-hero-scanline {
                animation: none !important;
            }
        }
    </style>

    <!-- ga & ba script hoook -->
    <script></script>
</head>
