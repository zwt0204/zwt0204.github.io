<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="google-site-verification" content="xBT4GhYoi5qRD5tr338pgPM5OWHHIDR6mNg1a3euekI" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="{{ site.description }}">
    <meta name="keywords"  content="{{ site.keyword }}">
    <meta name="theme-color" content="{{ site.chrome-tab-theme-color }}">
    
    <!-- Open Graph -->
    <meta property="og:title" content="{% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{ site.SEOTitle }}{% endif %}">
    {% case page.layout %}
    {% when 'post' %}
    <meta property="og:type" content="article">
    <meta property="og:description" content="{{ page.excerpt | strip_html | truncate:200 }}">
    {% if page.date %}
    <meta property="article:published_time" content="{{ page.date | date: "%Y-%m-%dT%H:%M:%SZ" }}">
    {% endif %}
    {% if page.author %}
    <meta property="article:author" content="{{ page.author }}">
    {% endif %}
    {% for tag in page.tags %}
    <meta property="article:tag" content="{{ tag }}">
    {% endfor %}
    {% else %}
    <meta property="og:type" content="website">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    {% endcase %}
    <meta property="og:image" content="{{ site.url }}{{ site.sidebar-avatar }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:site_name" content="{{ site.SEOTitle }}">
    
    <title>{% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{ site.SEOTitle }}{% endif %}</title>

    <!-- Web App Manifest -->
    <link rel="manifest" href="{{ site.baseurl }}/pwa/manifest.json">

    <!-- Favicon -->
    <link rel="shortcut icon" href="{{ site.baseurl }}/img/favicon.ico">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- Bootstrap Core CSS -->
    <link rel="stylesheet" href="{{ "/css/bootstrap.min.css" | prepend: site.baseurl }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ "/css/hux-blog.min.css" | prepend: site.baseurl }}">

    <!-- Custom Fonts -->
    <!-- <link href="http://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet" type="text/css"> -->
    <!-- Hux change font-awesome CDN to qiniu -->
    <link href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css" rel="stylesheet" type="text/css">


    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

    <style>
        body {
            background: radial-gradient(circle at top, #0f172a 0%, #111827 18%, #f8fafc 46%);
        }

        .navbar-custom {
            background: rgba(2, 6, 23, 0.68);
            border-bottom: 1px solid rgba(96, 165, 250, 0.16);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 12px 36px rgba(2, 6, 23, 0.20);
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .nav li a {
            color: rgba(226, 232, 240, 0.92);
        }

        .navbar-custom .navbar-brand:hover,
        .navbar-custom .nav li a:hover,
        .navbar-custom .nav li a:focus {
            color: #7dd3fc;
        }

        header.intro-header.page-header {
            overflow: hidden;
            border-bottom: 1px solid rgba(125, 211, 252, 0.12);
            box-shadow: inset 0 -80px 120px rgba(2, 6, 23, 0.34);
        }

        header.intro-header.page-header .header-mask {
            background:
                radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.18), transparent 30%),
                radial-gradient(circle at 80% 25%, rgba(59, 130, 246, 0.20), transparent 28%),
                linear-gradient(180deg, rgba(2, 6, 23, 0.48), rgba(2, 6, 23, 0.70));
        }

        header.intro-header.page-header .site-heading h1 {
            color: #f8fafc;
            text-shadow: 0 0 24px rgba(56, 189, 248, 0.18), 0 2px 14px rgba(2, 6, 23, 0.45);
        }

        header.intro-header.page-header .site-heading .subheading {
            color: rgba(226, 232, 240, 0.90);
            text-shadow: 0 2px 14px rgba(2, 6, 23, 0.42);
        }

        .home-hero-card {
            border: 1px solid rgba(96, 165, 250, 0.18);
            box-shadow: 0 24px 60px rgba(2, 6, 23, 0.30), 0 0 0 1px rgba(56, 189, 248, 0.05) inset;
        }

        .home-hero-card:before {
            background: radial-gradient(circle, rgba(56, 189, 248, 0.42), rgba(56, 189, 248, 0));
        }

        .home-hero-card:after {
            background: radial-gradient(circle, rgba(99, 102, 241, 0.30), rgba(99, 102, 241, 0));
        }

        .home-hero-grid {
            opacity: 0.9;
        }

        .hero-core-card,
        .home-hero-stat,
        .post-preview-card,
        .sidebar-container .short-about,
        .sidebar-container .featured-tags {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .hero-core-card {
            border: 1px solid rgba(125, 211, 252, 0.22);
            box-shadow: 0 24px 60px rgba(2, 6, 23, 0.34), 0 0 26px rgba(56, 189, 248, 0.10);
        }

        .home-hero-btn-primary {
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.32), 0 0 24px rgba(56, 189, 248, 0.16);
        }

        .post-preview-card {
            border: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
        }

        .post-preview-card:hover {
            border-color: rgba(56, 189, 248, 0.32);
            box-shadow: 0 20px 44px rgba(37, 99, 235, 0.12);
        }

        .sidebar-container .short-about,
        .sidebar-container .featured-tags,
        .sidebar-container .friends {
            padding: 16px 18px;
            margin-bottom: 18px;
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
        }
    </style>

    <!-- ga & ba script hoook -->
    <script></script>
</head>
